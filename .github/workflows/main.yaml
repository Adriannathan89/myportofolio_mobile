name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  build_apk:
    needs: build
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build release APK
        run: |
          DEFINE_ARGS=""
          if [ -n "$API_BASE_URL" ]; then
            DEFINE_ARGS="--dart-define=API_BASE_URL=$API_BASE_URL"
          fi
          flutter build apk $DEFINE_ARGS
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
